name: Feature request
description: Suggest an improvement to the CLI, MSBuild integration, diagnostics, or docs (for language syntax, use "Language proposal").
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Commands, flags, output, or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - MSBuild / NuGet packages
        - Diagnostics
        - Generated code
        - Agent integration (AGENTS.md, skills, rules)
        - Documentation
        - Other
